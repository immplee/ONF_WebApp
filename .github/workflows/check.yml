# 껍데기(Vercel 정적 페이지) 검사 — `test/*.test.js` 를 push 마다 돌린다.
#
# ⛔ [2026-10-01] 예전 `roster` 작업(명부 토큰 배정 검사 — tools/test_roster_sync.py)은 **지웠다.** 그 스크립트 사본은 2026-09-03 에
#   저장소에서 사라졌고(03e4181 「정본은 iCloud 밖으로 갔다」) 그 뒤로 이 작업은 **「검사 파일이 없다」로 계속 빨갰는데** 경로 조건(tools/**)이
#   안 맞아 아무도 못 봤다. 검사는 그 코드가 사는 곳에서 돌려야 한다 — 명부 동기화 검사는 정본 쪽 몫이다.
# 네트워크를 안 탄다(구글·Vercel 을 안 부른다 — vm 에 껍데기 코드만 올려 돈다).
name: check
on:
  push:
    branches: [main]
    paths:
      - 'teacher/**'
      - 'assets/**'
      - 'index.html'
      - 'test/**'
      - '.github/workflows/check.yml'
  pull_request:
    paths:
      - 'teacher/**'
      - 'assets/**'
      - 'index.html'
      - 'test/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # ⛔ [2026-10-01 Peter 「CI 단계 붙여줘」] 껍데기(teacher/index.html · assets/onf-frame.js)는 **로그인·토큰·키보드·기록 칸 배선**이 사는 파일인데,
  #   종전엔 이 저장소 검사(`test/*.test.js`)가 어떤 자동 관문에서도 안 돌았다(맥에서 손으로만) — 이 파일을 한 번 잘못 고쳐 라이브 로그인이 막힌 적이 있다(ff8d00a).
  #   ⚠️ 이 검사는 로그인이 **실제로 되는지는 못 본다** — 껍데기를 고치면 라이브에서 같이 재라(login-change-needs-live-test).
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # ⛔ 파일이 없으면 **실패**시킨다 — 「건너뜀」이 쌓이면 검사한 적 없는데 검사했다고 믿는다.
      - name: 껍데기 검사 (기록 칸 다리 · 액자 출처 자물쇠 · 키보드·제목 무변)
        run: |
          ls test/*.test.js > /dev/null || { echo "::error::껍데기 검사 파일이 없다 — 누가 지웠나"; exit 1; }
          for f in test/*.test.js; do
            echo "== $f"
            node "$f" || exit 1
          done
