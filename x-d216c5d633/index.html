<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><meta name="robots" content="noindex, nofollow"><title>시험 화면</title></head>
<body style="margin:0;background:#faf6f0;font:15px -apple-system,system-ui,sans-serif;color:#2b2118"><p id="m" style="padding:24px">여는 중…</p>
<script>
/* 「화면을 구글 밖으로」 버리는 시험(2026-10-23 · 읽기 전용) — 이 저장소에 실린 b.bin 은 잠겨 있다. 열쇠는 주소 # 뒤에만 있다. */
(async function () {
  var q = new URLSearchParams(location.hash.slice(1)), S = window.__SP = { f: q.get('f') || '', s: q.get('s') || '', t: q.get('t') || '' };
  S.p = fetch('https://onf-media.edia--orker.workers.dev/book/get?f=' + encodeURIComponent(S.f) + '&s=' + encodeURIComponent(S.s) + '&t=' + encodeURIComponent(S.t)).then(function (r) { return r.json(); });
  try {
    var k = Uint8Array.from(atob(q.get('k').replace(/-/g, '+').replace(/_/g, '/')), function (c) { return c.charCodeAt(0); });
    var buf = new Uint8Array(await (await fetch('b.bin')).arrayBuffer()), d0 = performance.now();
    var key = await crypto.subtle.importKey('raw', k, 'AES-GCM', false, ['decrypt']);
    var z = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12));
    var html = await new Response(new Blob([z]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    S.dec = performance.now() - d0;
    document.open(); document.write(html); document.close();
  } catch (e) { document.getElementById('m').textContent = '⚠️ 못 열었어요: ' + e.message; }
})();
</script></body></html>
