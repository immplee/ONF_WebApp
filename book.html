<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- ⛔ interactive-widget=resizes-content 를 넣지 마라. 안드로이드에서 innerHeight 까지 같이
     줄어 (innerHeight − vv.height) = 0 이 되고, 키보드 높이를 못 재게 된다. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ownify 교재</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ownify">
<meta name="theme-color" content="#7a5c3e">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="assets/onf-ui.css">
</head>
<body class="onf-full">
<div class="onf-wait"><div class="onf-spin"></div>교재를 펴는 중이에요</div>
<iframe id="app" allow="clipboard-write; microphone"></iframe>
<script src="assets/onf-frame.js"></script>
<script src="assets/onf-api.js"></script>
<script>
  var q = new URLSearchParams(location.search);
  var token = ONF.frame.getToken();
  var student = ONF.api.lookup(token);
  var book = student && (student.books.find(function (b) { return b.id === q.get('b'); }) || student.books[0]);

  if (!book) {
    document.body.innerHTML =
      '<div class="onf-page"><h1 class="onf-title">교재를 못 찾았어요</h1>' +
      '<p class="onf-sub">받으신 링크로 다시 열어 주세요.</p></div>';
  } else {
    ONF.frame.mount(document.getElementById('app'), ONF.api.bookUrl(book),
      { diag: q.get('diag') === '1' });
  }
</script>
</body>
</html>
