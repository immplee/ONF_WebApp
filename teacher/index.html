<!-- 홈 화면 추가(아이콘). ⛔ 학생 액자의 manifest 를 그대로 쓰면 이름·start_url 이 학생 것이라
     같은 아이콘 두 개가 생긴다 — teacher/ 전용으로 따로 둔다(아이콘 그림은 같은 파일을 가리킨다).
     ⚠️ iOS 사파리는 manifest 를 안 보고 apple-touch-icon 을 본다. 둘 다 필요하다. -->
<!-- ⛔ [2026-09-03 Peter] **절대경로여야 한다.** 이 화면은 끝 슬래시 없이도 열린다
     (`class.ownify.co.kr/teacher`). 그때 상대경로 `manifest.json` 은 `/teacher/manifest.json`
     이 아니라 **`/manifest.json`**(학생 것)으로 풀려서, 선생님이 「Ownify」 학생 앱을 설치하게
     된다 — 실제로 그렇게 깔렸다. 선생님 매니페스트는 멀쩡히 있는데 안 읽히고 있었다. -->

<script>/* 🌙 다크 모드 — 안쪽 액자가 알려 준 색(onfTheme · onf-frame.js)을 **그리기 전에** 단다 · 없으면 어둡게(Peter 2026-10-14 「홈페이지 기본은 다크모드로」 — 종전 기기 설정 · 홈에서 「기기 설정 따라」를 고르면 안쪽이 그 색을 알려 남는다) */(function(){try{var v=localStorage.getItem("onfTheme"),d=v!=="light";document.documentElement.setAttribute("data-theme",d?"dark":"light");}catch(e){}})();</script>
<link rel="stylesheet" href="../assets/onf-ui.css">
<style>
  html, body { margin:0; height:100%; background:var(--onf-bg); }
  /* ⛔ z-index 를 학생 액자와 **같은 겹침**으로 둔다(assets/onf-ui.css 의 .onf-full iframe).
     회전자(.onf-wait)는 z-index:0 이라 액자 뒤에 있고, 액자가 한 픽셀이라도 그리는 순간
     저절로 덮인다 — 걷는 JS 가 없으니 **노크를 놓쳐도 회전자에 갇히지 않는다**(2026-08-14 사고).
     실측(2026-09-02): 프레임이 막히거나(XFO/CSP) 응답 전이거나 연결이 실패하면 액자는 **투명**하다
     — 그 셋이 바로 사람이 본 「하얀 화면」이고, 그때 뒤의 회전자가 그대로 보인다. */
  #app { display:block; width:100%; height:100%; border:0; position:relative; z-index:1; }
  /* ⛔ .onf-wait 의 display:flex 는 브라우저 기본 [hidden]{display:none} 을 이긴다 — 다시 눌러 준다.
     ⛔ #app 도 같다(위 display:block) — 안 누르면 로그인 화면 밑에 「숨긴」 액자가 화면 높이만큼 깔려 페이지가 길어지고,
       아이폰(WebKit)은 그 빈 액자를 흰 종이로 칠한다(2026-10-14 Peter 「로그인 화면 아래 절반이 하얗다」 · WKWebView 실측 y=332 부터 흰색). */
  #wait[hidden] { display:none; }
  #app[hidden] { display:none; }
  /* 8초 뒤 안내는 여러 줄이라 가운데정렬을 눌러 준다(.onf-wait 는 한 줄 기준이라 안 걸어 뒀다).
     ⚠️ 여백·줄바꿈도 여기서 준다 — `.onf-wait` 는 학생 액자와 **같이 쓰는** 조각이라
       거기에 넣으면 「불러오는 중이에요」 한 줄까지 같이 바뀐다.
     ⛔ `word-break:keep-all` 을 빼지 마라. 폰에서 어절이 쪼개져 `주세요.` 만 혼자 떨어진다. */
  #waitmsg { text-align:center; padding:0 22px; max-width:32em; word-break:keep-all; text-wrap:pretty; }
  .lock { max-width:460px; margin:14vh auto 0; padding:0 24px; text-align:center;
          font:15px/1.65 -apple-system, BlinkMacSystemFont, 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
          color:var(--onf-ink); }
  .lock .em { font-size:34px; margin-bottom:12px; }
  .lock h2 { margin:0 0 9px; font-size:20px; font-weight:800; }
  .lock p { margin:0 0 18px; color:var(--onf-brown); }
  .lock .why { font-size:12.5px; color:var(--onf-mute); margin-top:14px; }
  #gsi { display:flex; justify-content:center; min-height:44px; }
</style>

<!-- 로그인 전 화면. 로그인이 끝나면 통째로 iframe 으로 바뀐다. -->
<div class="lock" id="lock">
  <div class="em">🔒</div>

  <!-- ⛔ [2026-09-23 Peter] **막다른 골목에 문을 낸다.** One Tap 이 개인 지메일을 고르면
       서버가 막는데, 종전엔 그 자리에서 할 수 있는 일이 아무것도 없었다("안 될 때가 있다").
       ⚠️ 평소엔 숨어 있다 — 잘 되는 사람에게 「다른 계정」을 권할 이유가 없다. -->

<!-- 접속 중 표시. ⛔ 새로 만들지 않는다 — 학생 액자(../index.html)가 쓰는 그 조각 그대로다
     (../assets/onf-ui.css 의 .onf-wait/.onf-spin). 이미 링크된 CSS 라 파일도 안 늘었다.
     ⛔ `hidden` 으로 시작한다 — position:fixed;inset:0 이라 안 그러면 로그인 화면(🔒)을 덮는다. -->
<div class="onf-wait" id="wait" hidden><div class="onf-spin"></div><span id="waitmsg">불러오는 중</span></div>
<iframe id="app" hidden allow="clipboard-write"></iframe>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="../assets/onf-api.js"></script>
<!-- 🔐 판(학생 exec)만 쓴다 — 여러 계정 우회 openExec. 홈 액자(/a/macros/ownify.co.kr)는 안 쓴다(아래 bookMake 주석). -->
<script src="../assets/onf-frame.js"></script>
<script>
/* =====================================================================
   선생님 홈 껍데기 — 하는 일은 **둘뿐**이다: 구글 로그인 · 토큰 넘기기.
   화면·데이터는 전부 GAS 가 그린다.

   왜 이 구조인가: GAS 를 그냥 열면 구글 배너가 위에 붙는다. 감싸는 페이지가 있으면 안 붙는데,
   `access: DOMAIN` 배포는 구글 로그인 화면을 거치고 **그 화면은 iframe 안에서 렌더를 거부한다**
   (X-Frame-Options). 그래서 배포를 익명으로 두고 **신원은 우리가 증명해서 넘긴다.**

   ⛔ 익명 배포이므로 서버의 모든 함수가 이 토큰을 검사한다(ONF_TeacherHome_Web.js `_onfTeacherMe`).
     여기서 넘기는 것은 **구글이 서명한 ID 토큰**이고, 서버는 그 서명을 구글에게 다시 물어 확인한다.
     ⛔ 이메일을 넘기지 않는다 — 넘기는 순간 아무나 남의 이름을 댈 수 있다.
   ===================================================================== */

/* ⛔ Cloud Console → 사용자 인증 정보 → OAuth 클라이언트 ID(웹).
     승인된 자바스크립트 원본 = https://immplee.github.io
     ⚠️ 이 값은 공개돼도 되는 값이다(클라이언트 ID 는 비밀이 아니다). 비밀은 서버가 하는 검증이다.
     ⛔ 서버(ONF_TeacherHome.js 의 ONF_TEACHER_CLIENT_ID)와 **같은 값**이어야 한다 —
       다르면 서버가 모든 토큰을 거절하고, 화면은 "들어올 수 없어요" 만 보여 준다. */
var CLIENT_ID = '182072398790-1aeau87175kb9ima3205frc8ufvpv78g.apps.googleusercontent.com';

/* 선생님 홈 GAS 배포. ⛔ 지금 도는 DOMAIN 배포(@5)와 **다른 주소**다 — 되돌릴 수 있게 따로 팠다.
   ⚠️ access 는 ANYONE_ANONYMOUS 가 **아니라 ANYONE** 이다(구글 로그인 필요, 계정 종류는 무관).
     실측 2026-08-14: 워크스페이스가 **새** 익명 배포를 막는다(403 「Drive 액세스 권한 필요」).
     학생 웹앱이 익명인 건 정책이 바뀌기 전에 만든 옛 배포라서다.
   ⛔ **틀렸던 전제(2026-08-14 반증)**: 「GIS 로그인을 먼저 시키니 iframe 을 띄울 땐 구글 세션이 있다」고
     적어 뒀는데 그게 아니었다. GIS 로 **어느 계정을 골랐든**, iframe 이 GAS 를 부를 때 구글이 쓰는 건
     **브라우저의 기본 구글 계정**이다. 크롬에 개인 지메일이 먼저 로그인돼 있으면 그 계정으로 열리고,
     회사 밖 계정이라 문 앞에서 잘린다(실물: 「액세스 권한 필요 · 로그인된 계정 immplee@gmail.com」).
     → 주소에 도메인을 박아(`/a/macros/ownify.co.kr/`) 회사 계정 쪽으로 몰고,
       그래도 막히면 **화면이 그 사실을 말한다**(아래 frameWatch). 조용히 구글 오류만 띄우지 않는다. */
var EXEC = 'https://script.google.com/a/macros/ownify.co.kr/s/AKfycbx4taL78DPmHmzICYP8DjjuedRDVDcgGaOeGUnoSValEI1dW4bWNX-e5x7LWFwfmF8X/exec';

/* ⛔ 주소에 **도메인을 박는다**(`/a/macros/ownify.co.kr/`). 그냥 `/macros/s/…` 로 두면
   구글이 **브라우저 기본 계정**으로 연다 — 크롬에 개인 지메일이 첫 계정이면 그 계정으로 열려서
   회사 밖 계정이라 문 앞에서 잘린다(실측 2026-08-14: 「액세스 권한 필요 · 로그인된 계정 immplee@gmail.com」).
   ⚠️ GIS 로그인(우리 토큰)과 **iframe 이 GAS 를 부를 때 쓰는 구글 세션은 별개다.**
     우리가 토큰을 아무리 잘 만들어도, 그 프레임을 여는 계정이 회사 계정이 아니면 우리 코드는 돌지도 않는다. */

var frame = document.getElementById('app');
var mounted = false, pending = '';

/* ═══ 받아 둔 토큰을 **아껴 쓴다** (Peter 2026-09-23 「새로고침하면 항상 다시 로그인해야 해」)
   ⛔ 종전엔 토큰이 가는 곳이 전역 변수 하나였다. 새로고침 = 그 변수가 사라짐 = GIS 를 처음부터
     다시 타야 함. 게다가 `mount()` 가 `onCredential` 안에서만 불려서 **액자 자체가 로그인
     뒤에야 만들어졌다** — 첫 화면이 느린 까닭의 하나이기도 하다.
   ⚠️ [2026-09-23 Peter] 처음엔 탭 단위(세션) 저장으로 뒀는데, 그러면 **북마크나 새 탭**으로 열 때
     여전히 다시 로그인했다. ⇒ 브라우저 단위 저장으로 올린다. 같은 도메인에 학생 토큰이 이미
     그렇게 살고 있어 위험이 새로 생기지는 않는다.
   ⛔ 대신 **만료(exp)를 반드시 본다** — 수명이 1시간이라 남아 있어도 대개 죽은 값이고,
     죽은 것은 꺼낼 때 지운다. 「오래 남긴다」가 아니라 「살아 있는 동안만 아껴 쓴다」가 뜻이다.
   ⛔ 이 검사는 **왕복을 아끼는 용도**이지 문이 아니다 — 진짜 검사(`aud`·`hd`·`exp`·서명)는
     서버가 한다. 여기서 느슨해도 서버가 막는다. */
var TOKKEY = 'onf_id_tok';
var SKEW = 120;                     // 만료 2분 전이면 안 쓴다(왕복 도중에 죽지 않게)

function tokExp(tok) {
  try {
    var p = String(tok).split('.');
    if (p.length !== 3) return 0;
    var b = p[1].replace(/-/g, '+').replace(/_/g, '/');
    while (b.length % 4) b += '=';
    return Number(JSON.parse(atob(b)).exp) || 0;
  } catch (e) { return 0; }
}
function tokAlive(tok) {
  var e = tokExp(tok);
  return !!e && (e - SKEW) > Math.floor(Date.now() / 1000);
}
/* 회사 계정인가. ⛔ **문이 아니라 안내용**이다 — 진짜 판정은 서버가 서명까지 보고 한다.
   ⚠️ `hd` 가 없는 개인 지메일이 One Tap 으로 올 수 있다(hd 는 힌트일 뿐 강제가 아니다). */
function tokHd(tok) {
  try {
    var p = String(tok).split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    while (p.length % 4) p += '=';
    var j = JSON.parse(atob(p));
    return String(j.hd || (String(j.email || '').split('@')[1] || ''));
  } catch (e) { return ''; }
}
function tokMine(tok) { return tokHd(tok) === 'ownify.co.kr'; }
function tokSave(tok) { try { localStorage.setItem(TOKKEY, tok); } catch (e) {} }
function tokLoad() {
  var t = '';
  try { t = localStorage.getItem(TOKKEY) || ''; } catch (e) {}
  if (t && t.indexOf('odk1.') === 0 && devkeyOff()) { try { localStorage.removeItem(TOKKEY); } catch (e0) {} return ''; }   // 열쇠를 못 쓰는 기기
  if (t && tokAlive(t) && tokMine(t)) return t;
  /* 죽은 토큰은 **치운다** — 남겨 두면 다음 새로고침마다 같은 헛수고를 한다. */
  if (t) { try { localStorage.removeItem(TOKKEY); } catch (e2) {} }
  return '';
}

/* ═══ 🔑 기기 열쇠를 못 쓰는 기기 (2026-10-12 Peter 아이폰 실측) ═══
   아이폰·아이패드·맥 사파리(WebKit)는 앱을 다시 열면 구글 창구를 거치기 **전엔** 끼운 구글 화면(exec)에 로그인 쿠키를
   안 실어 안쪽이 안 뜬다 — 열쇠로 구글 창구를 건너뛰면 「화면이 안 열렸어요」 에 갇힌다(10분 시험 열쇠로 실측).
   → 이 기기들은 열쇠를 **받아 두지도 꺼내 쓰지도 않는다**(지금처럼 구글 창구). 그 밖의 기기도 열쇠로 열다 노크가 안 오면
     DK_OFF 를 찍어 7일 동안 끈다(아래 mount 의 마감 시계). ⚠️ 크롬(맥·윈도) 은 그대로 쓴다. */
var DK_OFF = 'onf_devkey_off';
/* WebKit(아이폰·아이패드·맥 사파리)인가 — 기기 열쇠(아래)와 One Tap(맨 아래 start) 두 곳이 같이 본다. */
function webkitOnly() {
  var ua = (typeof navigator !== 'undefined' && navigator.userAgent) || '';
  if (/iPhone|iPad|iPod/.test(ua)) return true;                                          // iOS 의 크롬(CriOS)도 WebKit
  if (/Safari/.test(ua) && !/Chrome|Chromium|CriOS|FxiOS|Edg/.test(ua)) return true;     // 맥 사파리
  return typeof navigator !== 'undefined' && navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;   // 데스크톱 UA 를 쓰는 아이패드
}
function devkeyOff() {
  if (webkitOnly()) return true;
  try { var t = Number(localStorage.getItem(DK_OFF) || 0); return !!t && (Date.now() - t) < 7 * 86400000; } catch (e) { return false; }
}

function say(msg) { document.getElementById('why').textContent = msg || ''; }

/* 로그인 결과 — 여기서 받는 건 **구글이 서명한 ID 토큰** 하나뿐이다. */
function onCredential(res) {
  var tok = res && res.credential;
  if (!tok) return say('로그인은 됐는데 토큰을 못 받았어요. 새로고침해 주세요.');
  /* ⛔ 회사 계정이 아니면 **여기서 말한다.** 종전엔 그냥 액자를 열었고, 안쪽이 「권한 없음」을
     그리면 사람은 무엇을 해야 할지 몰랐다 — One Tap 이 개인 지메일을 고르면 늘 그랬다. */
  if (!tokMine(tok)) {
    say('회사 계정(@ownify.co.kr)이 아니에요. 아래에서 계정을 바꿔 주세요.');
    offerOther();
    return;
  }
  pending = tok;
  tokSave(tok);                      // 새로고침해도 다시 로그인하지 않게
  if (!mounted) mount(); else answer();
}

function mount() {
  if (!EXEC) return say('아직 주소가 설정되지 않았어요. (EXEC)');
  mounted = true;
  document.getElementById('lock').hidden = true;
  /* ⛔ 잠금화면을 치우는 **그 순간**부터 표시가 있어야 한다. 종전엔 여기부터 화면에 아무것도
     없었고(#why 는 #lock 안이라 같이 숨는다), 「3초」와 「영영」이 같은 흰 종이였다. */

    /* 📐 창 크기가 바뀌었다(2026-10-16 · 학생 껍데기와 같다) — 홈이 다시 잰 메뉴 끝·여백·모서리를 판 전부(보이는 판·숨긴 판)에 새로 단다. 보이기·숨기기·주소는 안 건드린다. 내 액자(위 bookFrom)에서 온 말만. */
    if (d.onf === 'bookBox') { for (i = 0; i < books.length; i++) bookPlace(books[i], d.left, d.m, d.r); bookKb(); return; }
    if (d.onf === 'bookDismiss') { bookClose(true); return; }   // 메뉴를 눌렀다 = 전부 닫고 홈(앞 판을 보이지 않는다)
    if (d.onf === 'theme') { onfShellTheme(d.v); return; }   // 🌙 화면 색(안쪽 선생님 홈이 알린다)
    return;
  }
  for (i = 0; i < books.length && !p; i++) if (bookFrom(ev, books[i].el)) p = books[i];
  if (!p) return;                                              // 판 액자(교재·내 문장)
  if (d.onf === 'bookHi') {
    if (!/^https:\/\/[^\/:]+\.googleusercontent\.com$/.test(String(ev.origin))) return;
    p.win = ev.source; p.origin = ev.origin; p.swap = d.swap === 1;   // 📖 swap:1 은 둘째 노크에 온다 — 첫 노크(없음)가 다시 오면 판이 다시 읽힌 것
    if (p.real !== p.load || p.sw) { p.real = p.load; if (p.sw) bookSwapEnd(p, p.sw, false, 'fail', ''); p.src = p.load; p.key = bookKey(p.load); }   // 다시 읽힌 판 = 처음 주소
    bookTell(p);
    var bd = bookBoard(), q = bookQ;   // 📖 판이 생겼다 — 노크 전에 줄 선 미리 주소를 흘린다(위 bookQ)
    if (bd && q.length) { bookQ = []; q.forEach(function (s) { if (!bookFind(s)) bookFetch(bd, s); }); }
    return;
  }
  if (d.onf === 'bookSwapped') { bookSwapped(p, d); return; }   // 📖 판의 답 — 숨긴 판도(답을 기다리는 사이 사람이 닫을 수 있다)
  if (d.onf === 'themeAsk') { themeAsk(ev); return; }         // 🌙 판 안 교재가 묻는다(2단계) — 숨긴 판도(보일 때 색이 맞게)
  if (d.onf === 'hist') { bookHist(p, ev); return; }           // 📱 판 안쪽 기록 다리(폰만 켠다 · 숨긴 판의 노크도 받는다)
  if (d.onf === 'frameHello') { p.kb = ev.source; p.ko = ev.origin; kbH = -1; kbTop = -1; bookKb(); return; }   // 📱 이 판 교재의 키보드 높이 받는 창
  if (p.parked) return;                                        // ⛔ 숨긴 판은 닫기·전체·갈아 끼우기를 못 부른다
  if (d.onf === 'bookClose') bookClose(d.all === 1);   // all:1 = 교재 머리줄 「홈」 — 앞 판 없이 전부 닫기
  else if (d.onf === 'bookFull') p.box.classList.toggle('full', !!d.on);
  else if (d.onf === 'openBook' && typeof d.href === 'string') {
    bookOpen(d.href);
    var q = bookShown();                                      // 🅱 앞 판 규칙(위 bookClose) — 새로 보이게 된 판 q 의 「나를 열어 준 판」을 p 로 · 돌아간 것이면 그대로 · 폰은 종전
    if (q && q !== p && !phone() && !bookOpener(p, q)) q.back = p;
  }
});
window.addEventListener('keydown', function (e) { if (e.key === 'Escape') bookClose(false); });   // 보이는 판만(숨긴 판은 Esc 를 안 먹는다)
window.addEventListener('popstate', function () { bookPop(histTop()); });   // 📱 홈 칸 깊이·홈 알림은 onf-hist 블록(판 칸이 맨 위면 홈은 안 바뀌었다)
/* 📱 폰 ↔ PC(폭이 바뀜) — 모양(<html class="onf-ph">)·자리 수를 맞추고, 폰이 되면 보이는 판에 판 칸(뒤로 = 숨김) · 폰→PC 면 남은 판 칸은 ✕ 가 걷는다. 옛 사파리는 addListener 뿐. */
function bookMode() {
  try { document.documentElement.classList.toggle('onf-ph', phone()); } catch (e) {}
  var p = bookShown();
  if (p && phone()) histBook(p);
  bookRoom(bookMax());
  bookKb();
}
if (wideMq) {
  bookMode();
  try { wideMq.addEventListener('change', bookMode); } catch (e) { try { wideMq.addListener(bookMode); } catch (e2) {} }
}
/* onf-book:end */

/* ═══ 기록 칸 다리 — 안쪽의 「뒤로 = 창 닫기」 기록 칸을 **여기(최상위 문서)** 에 만든다 (Peter 2026-10-01) ═══
   ⛔ 왜: 아이폰 스와이프 뒤로는 이전 기록의 스냅샷을 덮개로 깔고, **메인 프레임**의 같은 문서 이동 신호가 오면 덮개를 걷는다.
     기록 칸을 가장 안쪽 iframe(GAS 샌드박스)에서 만들면 그 pop 이 서브프레임 이동이라 신호가 안 와 덮개(빈 화면)가 **3초 감시 타이머**까지 남았다
     (WebKit ViewGestureController 소스 확인 · 「하얀 화면 → 좀 뒤에 목록」 · 아이폰 실기기로 덮개 자체는 못 쟀다). 칸이 여기 있으면 SPA 처럼 제때 걷힌다.
   ⛔ 받는 말은 **우리가 정한 그 안쪽 창**(`ev.source === appWin && ev.origin === appOrigin`)에서 온 것뿐이다 — 로그인 노크와 같은 자물쇠. 나머지는 버린다.
   ⛔ 값 검증: op 는 push|back|hello · id 는 [A-Za-z0-9]{1,40} · state 는 JSON 2KB 이하의 평범한 객체. 아니면 버린다.
   ⛔ **로그인·토큰 배선(auth-please·mount·answer 의 흐름)은 건드리지 않았다**(ff8d00a 로 되돌린 적 있다) — 여기는 별도 리스너 둘 + 시작 한 줄이다.
   ⚠️ 알고 받아들인 한계: 껍데기 문서 자체가 다시 읽히면(새로고침·아이폰이 탭을 버렸다 복원) 죽은 칸 하나가 남아 첫 뒤로 1회가 같은 주소로 돌아가 다시 읽는다
     (종전과 같다 — 표식만 지울 수 있고 칸은 못 없앤다). 안쪽만 다시 읽힐 땐 안쪽의 `hello` 로 죽은 칸을 치운다.
   ⚠️ 이 블록은 껍데기가 최상위일 때만 돈다(남의 액자 안이면 아래 「여기서는 열 수 없어요」 갈래). 검사가 표지 구간만 떼어 vm 에서 돌린다. */
if (window.top === window.self) {
/* onf-hist:begin */
var histDepth = 0;                        // 지금 기록에 쌓인 우리 칸 수(칸 state.n 에서 다시 읽는다)
var HIST_ID = /^[A-Za-z0-9]{1,40}$/;
function histSmall(st) {                  // JSON 으로 2KB 이하인 평범한 객체인가
  if (!st || Object.prototype.toString.call(st) !== '[object Object]') return false;
  try { return unescape(encodeURIComponent(JSON.stringify(st))).length <= 2048; } catch (e) { return false; }
}
window.addEventListener('message', function (ev) {
  var d = ev && ev.data, s, n;
  if (!d || d.onf !== 'hist') return;
  if (!appWin || ev.source !== appWin || ev.origin !== appOrigin) return;     // 우리가 정한 그 창·출처만
  /* ⚠️ hello 의 go(-n) 은 「기록 맨 위 n 칸이 전부 우리 칸」이라는 **전제**에 선다 — 안쪽은 칸을 넣은 뒤 **문서 이동을 하지 않고**(같은 주소의 새로 읽기만) 껍데기는 우리 칸 밖에는 아무것도 안 쌓는다.
     안쪽이 주소를 바꿔 문서 이동을 얹으면 go(-n) 이 엉뚱한 칸에 닿는다(검수 2026-10-01 · 실제 GAS 「다시 불러오기」는 같은 주소라 해당 없다고 보지만 실기기는 못 쟀다). */
  if (d.op === 'hello') {                 // 안쪽이 새로 떴다 — 옛 안쪽이 남긴 죽은 칸을 치운다(같은 문서 안 칸이라 조용히 빠진다)
    //   📱 판 칸이 맨 위면 안 치운다 — go(-n) 이 판 칸부터 걷는다(「맨 위 n 칸이 전부 홈 칸」 전제가 깨진다 · 죽은 홈 칸은 남는 한계 · onf-book 블록)
    if (histDepth > 0 && !histRun()) { n = histDepth; histDepth = 0; try { history.go(-n); } catch (e) {} }
    return;
  }
  if ((d.op !== 'push' && d.op !== 'back') || typeof d.id !== 'string' || !HIST_ID.test(d.id)) return;
  if (d.op === 'push') {
    if (!histSmall(d.state)) return;
    /* ⛔ 받은 state 를 **JSON 으로 납작하게 만든 사본**으로만 넣는다 — 「JSON 2KB 이하」 상한이 Map·Set·Date 같은 JSON 으로 안 나오는 타입으로 우회되면
       pushState 의 구조화 복제가 덩어리째 기록 칸에 저장되고 popstate 마다 안쪽으로 되돌려 보낸다(검수 2026-10-01). 평범한 JSON 값만 남긴다. */
    var flat = null;
    try { flat = JSON.parse(JSON.stringify(d.state)); } catch (e) { return; }
    try { history.pushState({ onfHist: d.id, s: flat, n: histDepth + 1 }, ''); histDepth++; } catch (e) {}   // 주소 칸은 비운다
    return;
  }
  s = history.state;                      // back — 맨 위가 그 id 일 때만(남의 칸 보호 · 📱 판 칸·판 안쪽 칸은 홈 것이 아니다)
  if (s && s.onfHist === d.id && !bookOwner(s)) history.back();
});
window.addEventListener('popstate', function () {
  var s = history.state, h = (s && s.onfHist) ? s : null;
  histDepth = (h || bookOwner(s)) ? Math.max(0, Number(s.n) || 0) : 0;   // 📱 판 칸의 n = 그 아래 홈 칸 수
  if (!appWin || bookOwner(s)) return;    // 📱 판 칸이 맨 위면 홈은 안 바뀌었다(판 칸은 늘 홈 칸 위에 쌓인다 · 판 숨김·보임은 onf-book 블록 bookPop)
  try { appWin.postMessage({ onf: 'hist-pop', id: h ? h.onfHist : '', s: h ? (h.s || null) : null }, appOrigin); } catch (e) {}   // '*' 금지
});
try { if (history.state && (history.state.onfHist || history.state.onfBook)) history.replaceState(null, ''); } catch (e) {}   // 껍데기가 다시 읽힌 채 남은 표식만 지운다(📱 판 칸 포함)
/* onf-hist:end */
}

/* ⛔ 이 페이지는 **최상위에서만** 돈다. 남이 우리를 iframe 으로 감싸면 로그인·토큰이
   그 페이지 손에 들어간다. 로그인 화면은 원래 최상위에서만 도는 것이다. */
if (window.top !== window.self) {
  document.getElementById('lock').innerHTML =
    '<div class="em">🔒</div><h2>여기서는 열 수 없어요</h2>'
    + '<p>주소창에 직접 열어 주세요.</p>';
} else

/** 「다른 계정으로 로그인」을 띄운다. 누르면 자동 선택을 끄고 받아 둔 것도 버린 뒤 다시 묻는다. */
function offerOther() {
  var b = document.getElementById('other');
  if (!b) return;
  b.hidden = false;
  b.onclick = function () {
    try { localStorage.removeItem(TOKKEY); } catch (e) {}
    try { google.accounts.id.disableAutoSelect(); } catch (e2) {}
    say('계정을 고르는 창을 띄웠어요.');
    try { google.accounts.id.prompt(); } catch (e3) {
      say('계정 창이 안 떠요 — 크롬 오른쪽 위 프로필에서 회사 계정으로 바꿔 주세요.');
    }
  };
}

/* ⛔ **GIS 를 기다리기 전에** 받아 둔 토큰부터 본다. 살아 있으면 그 자리에서 화면을 연다 —
   새로고침이 로그인 없이 바로 간다. GIS 는 그 뒤에 조용히 초기화해서 다음 토큰을 준비한다. */
var reused = false;
/* ⛔ [2026-10-12 Peter 아이폰] WebKit(아이폰·아이패드·맥 사파리)은 앱을 다시 열면 **구글 창구를 거치기 전엔** 끼운 구글 화면에
   로그인 쿠키를 안 싣는다 — 받아 둔 토큰(1시간 구글 토큰도)으로 바로 열면 「화면이 안 열렸어요」. 이 기기들은 늘 구글 창구부터(devkeyOff). */
(function reuse() {
  var t = tokLoad();
  if (!t || devkeyOff()) return;
  pending = t;
  reused = true;
  mount();
})();

/* GIS 가 늦게 도착할 수 있다 — 있을 때 시작한다. */
(function start() {
  if (!window.google || !google.accounts || !google.accounts.id) return setTimeout(start, 120);
  if (!CLIENT_ID) return say('아직 클라이언트 ID 가 설정되지 않았어요.');
  google.accounts.id.initialize({
    client_id: CLIENT_ID,
    callback: onCredential,
    auto_select: true,          // 회사 계정 하나뿐이면 누를 것도 없다
    itp_support: true,
    hd: 'ownify.co.kr'          // 계정 고르는 화면에서 회사 계정만 (⚠️ 이건 편의일 뿐 — **검사는 서버가 한다**)
  });
  google.accounts.id.renderButton(document.getElementById('gsi'),
    { theme: 'outline', size: 'large', text: 'signin_with', locale: 'ko' });
  /* ⛔ [2026-09-23 Peter 「접속은 됐는데 우측 상단에 로그인 알림이 떠」] **이미 들어와 있으면
     묻지 않는다.** 받아 둔 토큰으로 화면을 연 뒤에도 One Tap 을 띄우면, 다 된 화면 위에
     「로그인하세요」가 떠 있는 셈이다 — 눌러야 하는 줄 알고 누르면 오히려 계정이 엇갈린다.
     ⚠️ `initialize` 는 그대로 한다 — 나중에 토큰이 만료되거나 [다른 계정으로]를 누르면
       그때 `prompt()` 를 부를 수 있어야 한다(그 길은 메시지 핸들러에 있다). */
  /* ⛔ [2026-10-14 Peter 아이폰 「로그인했는데 또 로그인 창이 뜬다」] **WebKit 에선 첫 One Tap 을 안 띄운다.**
     WebKit 은 ITP 라 One Tap 이 계정을 모른다 — 계정 없는 「Google 계정으로 … 로그인 [계속]」 시트를 띄우고, [계속]을 누르면
     구글 계정 고르기 창(팝업)을 **또** 연다(GIS 문서 「ITP 브라우저」 · itp_support). 버튼도 같은 팝업 하나로 끝나니 시트는 겹치는 한 단계다.
     ⚠️ 그 팝업(구글 창구)은 남는다 — WebKit 은 구글 창구를 거쳐야 끼운 exec 에 로그인 쿠키를 싣는다(위 webkitOnly · 2026-10-12 실측).
       ⛔ 버튼 팝업으로도 그 문이 열리는지는 **라이브에서 Peter 와 확인**(가짜로는 못 잰다) — 안쪽이 안 열리면 이 줄을 `if (!reused)` 로 되돌린다.
     ⚠️ login_hint 로 고르기 창을 건너뛰지 않는다 — 고르기 창에서 누르는 손이 WebKit 쿠키 문을 여는 것일 수 있다(못 잼).
     ⚠️ 만료·[다른 계정으로]의 prompt()(메시지 핸들러)는 그대로다 — 그땐 누를 버튼이 화면에 없다. */
  if (!reused && !webkitOnly()) google.accounts.id.prompt();
})();
</script>
