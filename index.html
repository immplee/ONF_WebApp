<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- ⛔ interactive-widget=resizes-content 를 넣지 마라. 안드로이드에서 innerHeight 까지 같이
     줄어 (innerHeight − vv.height) = 0 이 되고, 키보드 높이를 못 재게 된다. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ownify</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon/onf-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon/onf-192.png">
<link rel="apple-touch-icon" href="assets/icon/onf-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ownify">
<meta name="theme-color" content="#7a5c3e">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="assets/onf-ui.css">
</head>
<body class="onf-full">
<div class="onf-wait"><div class="onf-spin"></div>불러오는 중이에요</div>
<iframe id="app" allow="clipboard-write; microphone"></iframe>
<script src="assets/onf-frame.js"></script>
<script src="assets/onf-api.js"></script>
<script>
  // 액자가 하는 일은 셋뿐 — 토큰 기억 · iframe 띄우기 · 키보드 재서 앱에 넘기기.
  // 화면(홈·교재)은 전부 GAS 가 그린다(액자에서 구글을 fetch 하면 CORS 로 막힌다).
  var q = new URLSearchParams(location.search);
  var token = ONF.frame.getToken();
  var extra = [];
  // ⛔ 여기 없는 파라미터는 앱에 **안 전해진다**. 홈이 만드는 링크와 반드시 같이 봐야 한다
  //    (GAS: ONF_Home_Html.html 의 mk()). 빠뜨리면 액자를 거치는 순간 그 값이 증발한다.
  //    back = 실수로 다음 회차를 눌렀을 때 돌아갈 회차 · ttok = 선생님 링크
  //    ⛔ ttok **값**을 이 저장소에 상수로 넣지 마라 — immplee/ONF_WebApp 은 PUBLIC 이다.
  //      여기서는 주소에 실려 온 것을 그대로 통과시키기만 한다.
  //    tas = 이 링크를 받은 **선생님 이름**. 없으면 앱이 교재 담당쌤 이름으로 착각해
  //      읽음 장부가 남의 칸에 쌓이고 '내 글' 표시도 어긋난다(2026-08-12).
  ['fileId', 'sheetName', 'mode', 'back', 'ttok', 'tas'].forEach(function (k) {
    if (q.get(k)) extra.push(k + '=' + encodeURIComponent(q.get(k)));
  });
  if (q.get('diag') === '1') extra.push('diag=1');
  /* [2026-08-29 Peter] 짧은 주소 — `class.ownify.co.kr/thegoodplace-s1-e1-sandy`.
     Vercel 이 그 경로를 이 파일로 돌려 주고(vercel.json), 우리는 **경로를 그대로 앱에 넘긴다**.
     교재를 찾는 것은 GAS 다(명부가 거기 있고, 여기서 구글을 부르면 CORS 로 막힌다).
     ⛔ 모양이 맞는 것만 넘긴다 — 아무 경로나 넘기면 GAS 가 못 읽는 값을 계속 받는다.
     ⛔ `fileId` 가 이미 있으면 넘기지 않는다(옛 주소가 이긴다 — 둘 다 오면 뜻이 갈린다). */
  var path = decodeURIComponent(location.pathname.replace(/^\/+|\/+$/g, '')).toLowerCase();
  if (!q.get('fileId') && /^[a-z0-9]+-s\d+-e\d+-[a-z0-9]+$/.test(path)) {
    extra.push('slug=' + encodeURIComponent(path));
  }
  /* 토큰은 이미 이 도메인에 저장됐다 — 주소창에서 지운다(화면 찍어 보낼 때 같이 나가면 안 된다).
     ⛔ 반드시 위 `q.get(...)` 들을 다 읽은 **뒤**여야 한다. */
  ONF.frame.hideToken();
  ONF.frame.mount(document.getElementById('app'),
                  ONF.api.appUrl(token, extra.join('&')),
                  { diag: q.get('diag') === '1' });
</script>
</body>
</html>
