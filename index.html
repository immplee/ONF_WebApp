<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- ⛔ interactive-widget=resizes-content 를 넣지 마라. 안드로이드에서 innerHeight 까지 같이
     줄어 (innerHeight − vv.height) = 0 이 되고, 키보드 높이를 못 재게 된다. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ownify</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icon/onf-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icon/onf-192.png">
<link rel="apple-touch-icon" href="/assets/icon/onf-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ownify">
<meta name="theme-color" content="#7a5c3e">
<!-- ⛔ **매니페스트만은 상대경로다.** 다른 자산(CSS·JS·아이콘)과 규칙이 반대이므로 헷갈리지 마라.
     이 파일은 세 깊이로 서빙되는데, 매니페스트는 **그 깊이에 맞는 것**이 걸려야 한다:
       /                        → /manifest.json                  (공용)
       /i/<토큰>/               → /i/<토큰>/manifest.json         (그 학생)
       /<짧은주소>              → /manifest.json                  (공용)
     ⛔ JS 로 `link.href` 를 갈아 끼우는 길은 **안 통한다** — 2026-09-03 아이폰 실측:
       갈아 끼워도 「홈 화면에 추가」 시트에 `class.ownify.co.kr/` 가 떴다(브라우저가 설치를
       고민하는 시점에 바뀐 href 를 다시 안 본다). 그래서 **HTML 이 나올 때부터** 맞아야 한다.
     ⚠️ 그래서 아이콘에 학생 주소를 담으려면 학생이 `/i/<토큰>/` 에 **서 있어야** 한다. -->
<link rel="manifest" href="manifest.json">
<!-- ⛔ 자산 경로는 **절대경로여야 한다.** 이 한 파일이 서로 다른 깊이로 서빙된다:
       `/` · `/<짧은주소>` · `/i/<토큰>/`(홈 화면 아이콘). 상대경로면 마지막 것에서
       `/i/<토큰>/assets/…` 로 풀려 **CSS·JS 가 통째로 404** 가 되고, 화면은
       「불러오는 중이에요」 글자만 남는다(2026-09-03 실제로 그렇게 배포됐다 — 그려 봐서 잡았다).
       ⚠️ 새 `<link>`·`<script>` 를 넣을 때도 `/` 로 시작해라. test/onf-frame.test.js 가 검사한다. -->
<script>/* 🌙 다크 모드 — 안쪽 액자가 알려 준 색(onfTheme · onf-frame.js)을 **그리기 전에** 단다 · 없으면 어둡게(Peter 2026-10-14 「홈페이지 기본은 다크모드로」 — 종전 기기 설정 · 홈에서 「기기 설정 따라」를 고르면 안쪽이 그 색을 알려 남는다) */(function(){try{var v=localStorage.getItem("onfTheme"),d=v!=="light";document.documentElement.setAttribute("data-theme",d?"dark":"light");}catch(e){}})();</script>
<link rel="stylesheet" href="/assets/onf-ui.css">
</head>
<body class="onf-full">
<div class="onf-wait"><div class="onf-spin"></div><span>불러오는 중<span class="onf-ld"></span></span></div>
<iframe id="app" allow="clipboard-write; microphone"></iframe>
<script src="/assets/onf-frame.js"></script>
<script src="/assets/onf-api.js"></script>
<script>
  // 액자가 하는 일은 셋뿐 — 토큰 기억 · iframe 띄우기 · 키보드 재서 앱에 넘기기.
  // 화면(홈·교재)은 전부 GAS 가 그린다(액자에서 구글을 fetch 하면 CORS 로 막힌다).
  var q = new URLSearchParams(location.search);
  var token = ONF.frame.getToken();
  /* ⛔ 여기서 매니페스트 링크를 갈아 끼우지 마라 — **안 통한다**(2026-09-03 아이폰 실측).
     아이콘 주소는 위 <link> 가 나올 때 정해진다. 학생별 아이콘은 학생이 `/i/<토큰>/` 에
     서 있을 때만 만들어진다. */
  var extra = [];
  // ⛔ 여기 없는 파라미터는 앱에 **안 전해진다**. 홈이 만드는 링크와 반드시 같이 봐야 한다
  //    (GAS: ONF_Home_Html.html 의 mk()). 빠뜨리면 액자를 거치는 순간 그 값이 증발한다.
  //    back = 실수로 다음 회차를 눌렀을 때 돌아갈 회차 · ttok = 선생님 링크
  //    ⛔ ttok **값**을 이 저장소에 상수로 넣지 마라 — immplee/ONF_WebApp 은 PUBLIC 이다.
  //      여기서는 주소에 실려 온 것을 그대로 통과시키기만 한다.
  //    tas = 이 링크를 받은 **선생님 이름**. 없으면 앱이 교재 담당쌤 이름으로 착각해
  //      읽음 장부가 남의 칸에 쌓이고 '내 글' 표시도 어긋난다(2026-08-12).
  //    line = 내 문장의 「📖 교재에서 보기」가 실어 오는 교재 줄 번호 · view = 내 문장 모드가 처음 열 칸(드라마 시즌)
  //      (2026-10-09). 둘 다 빠져 있어서 점프와 「그 칸으로 열기」가 라이브에서 조용히 죽을 뻔했다 — 이름이 아니라 **목록**이 문이다.
  ['fileId', 'sheetName', 'mode', 'back', 'ttok', 'tas', 'line', 'view'].forEach(function (k) {
    if (q.get(k)) extra.push(k + '=' + encodeURIComponent(q.get(k)));
  });
  if (q.get('diag') === '1') extra.push('diag=1');
  if (q.get('perf') === '1') extra.push('perf=1');   // 속도 표식(2026-10-12 · 기기 열쇠 세션 부탁) — 앱이 화면 구석 표를 그린다
  if (q.get('home') === 'v2') extra.push('home=v2');   // 🧱 학생 새 홈 시험 링크(2026-10-12 · 선생님 홈 owner 「새 학생 홈(시험)」) — 아는 값 하나만
  /* 홈 화면 아이콘 안내 — **판정은 여기서만 한다.** 앱은 구글 래퍼 안 아이프레임이라
     `navigator.standalone` 을 믿을 수 없다(인앱 웹뷰에선 `undefined`, 프레임 안에선 없다).
       ask   = 아이콘을 만들 수 있는 기기인데 아직 `/i/<토큰>/` 에 안 서 있다 → 앱이 링크를 낸다
       guide = 이미 그 주소에 서 있다 → 앱이 「공유 → 홈 화면에 추가」를 안내한다
     ⛔ **iOS 만** 켠다. 안드로이드·데스크톱은 브라우저와 저장소를 나눠 쓰므로 `/` 로 깔아도
       그 학생 홈이 열린다 — 안내가 필요 없다(괜히 내면 없는 버튼을 찾게 된다).
     ⛔ `!standalone` 으로 쓰지 마라. 카톡·인스타 인앱 웹뷰는 `undefined` 라 그 조건을 통과하는데
       거기엔 「홈 화면에 추가」가 아예 없다 — **진짜 사파리만 `=== false`** 다.
     ⚠️ 아이패드는 기본이 데스크톱 UA(`Macintosh`)라 UA 만 보면 통째로 빠진다 — 터치점으로 가른다. */
  var _iOS = /iPhone|iPad|iPod/.test(navigator.userAgent)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  /* ⛔ `navigator.standalone === false` 로 쓰지 마라 — 그건 **사파리 전용** 속성이라
     **크롬 for iOS 에서는 `undefined`** 다. 그렇게 두면 크롬 쓰는 학생에겐 버튼이 영영 안 뜬다
     (Peter 가 크롬으로 쓰고 있었다). 그래서 「standalone 이 아니다」로 뒤집어 쓴다. */
  var _standalone = navigator.standalone === true
    || !!(window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  /* ⛔ 인앱 웹뷰는 뺀다 — 카톡·인스타·라인·페북 안에는 **「홈 화면에 추가」가 아예 없다.**
     안내를 내면 학생이 없는 버튼을 찾다가 「카카오톡으로 공유」를 누른다.
     ⚠️ 넓게 잡아도 안전한 이유: 이 안내는 **누를 때까지** 주소에 토큰을 싣지 않는다.
       잘못 떠도 최악이 「없는 버튼을 찾는다」이고, 토큰이 새지 않는다. */
  var _inApp = /KAKAOTALK|Instagram|FBAN|FBAV|FB_IAB|Line\/|NAVER|DaumApps|Twitter|KAKAOSTORY/i
    .test(navigator.userAgent);
  if (token && _iOS && !_standalone && !_inApp) {
    extra.push('a2hs=' + (ONF.frame.tokenFromPath() ? 'guide' : 'ask'));
  }
  /* 주소로 넘어온 값은 **그대로 통과시킨다** — 아이폰 없이 이 화면을 보려면 이 길이 필요하다
     (헤드리스에선 위 판정을 흉내 낼 수 없다: standalone 은 사파리만 준다).
     ⚠️ 아는 낱말만. 잘못 떠도 위험이 없다(위 주석). */
  var _a2q = q.get('a2hs');
  if (token && (_a2q === 'ask' || _a2q === 'guide') && extra.indexOf('a2hs=ask') < 0
      && extra.indexOf('a2hs=guide') < 0) {
    extra.push('a2hs=' + _a2q);
  }
  /* [2026-08-29 Peter] 짧은 주소 — `class.ownify.co.kr/thegoodplace-s1-e1-sandy`.
     Vercel 이 그 경로를 이 파일로 돌려 주고(vercel.json), 우리는 **경로를 그대로 앱에 넘긴다**.
     교재를 찾는 것은 GAS 다(명부가 거기 있고, 여기서 구글을 부르면 CORS 로 막힌다).
     ⛔ 모양이 맞는 것만 넘긴다 — 아무 경로나 넘기면 GAS 가 못 읽는 값을 계속 받는다.
     ⛔ `fileId` 가 이미 있으면 넘기지 않는다(옛 주소가 이긴다 — 둘 다 오면 뜻이 갈린다). */
  var path = decodeURIComponent(location.pathname.replace(/^\/+|\/+$/g, '')).toLowerCase();
  if (!q.get('fileId') && /^[a-z0-9]+-s\d+-e\d+-[a-z0-9]+$/.test(path)) {
    extra.push('slug=' + encodeURIComponent(path));
  }
  /* 📱 폰 판 스위치(2026-10-14 · 실기기 확인 전 기본 끔) — 주소에 phonepanel=1 이면 이 기기에 켜 두고(기억) · phonepanel=0 이면 끈다.
     켜는 날(모두에게)은 아래 기본값을 '1' 로. ⚠️ 저장소가 막힌 창(사생활 보호)이면 주소로 연 그 한 번만. */
  var phoneOn = q.get('phonepanel');
  try { if (phoneOn === '1' || phoneOn === '0') localStorage.setItem('onfPhonePanel', phoneOn); else phoneOn = localStorage.getItem('onfPhonePanel'); } catch (eP) {}
  /* 토큰은 이미 이 도메인에 저장됐다 — 주소창에서 지운다(화면 찍어 보낼 때 같이 나가면 안 된다).
     ⛔ 반드시 위 `q.get(...)` 들을 다 읽은 **뒤**여야 한다. */
  ONF.frame.hideToken();
  /* 📖 홈 안에서 교재 열기(PC · 2026-10-12 Peter 홈 리디자인 3단계) — 홈이 교재 카드 주소를 보내면 그 주소에서 **아는 값만** 골라
     같은 앱 주소에 `embed=1` 을 붙여 오른쪽 판에 띄운다. 주소의 토큰(t)은 버린다 — 토큰은 이 도메인에 이미 있다.
     ⛔ 우리 껍데기 주소(class·script.ownify.co.kr)의 교재 모양(짧은 주소 또는 mode=share)·⭐ 내 문장(mode=mine)만 — 아니면 null(안 연다).
     ⭐ 내 문장도 판으로(2026-10-12 Peter 「교재처럼 작게 떴다가 · 창 끄면 바로 홈」) — 같은 교재 틀이라 [전체 화면][✕] 가 이미 있다. */
  var BOOK_KEYS = ['fileId', 'sheetName', 'mode', 'back', 'line', 'view'];
  function bookSrc(href) {
    try {
      var u = new URL(String(href || ''), location.href);
      if (!/^(class|script)\.ownify\.co\.kr$/.test(u.hostname) && u.origin !== location.origin) return null;
      var p = decodeURIComponent(u.pathname.replace(/^\/+|\/+$/g, '')).toLowerCase(), ex = [];
      var slugOk = /^[a-z0-9]+-s\d+-e\d+-[a-z0-9]+$/.test(p);
      var md = u.searchParams.get('mode');
      if (md !== 'share' && md !== 'mine' && !slugOk) return null;   // 교재·⭐ 내 문장만(홈은 안 연다)
      BOOK_KEYS.forEach(function (k) { if (u.searchParams.get(k)) ex.push(k + '=' + encodeURIComponent(u.searchParams.get(k))); });
      if (!u.searchParams.get('fileId') && slugOk) ex.push('slug=' + encodeURIComponent(p));
      if (!ex.length) return null;
      ex.push('embed=1');
      return ONF.api.appUrl(token, ex.join('&'));
    } catch (e) { return null; }
  }
  ONF.frame.mount(document.getElementById('app'),
                  ONF.api.appUrl(token, extra.join('&')),
                  { diag: q.get('diag') === '1', bookSrc: bookSrc, phone: phoneOn === '1' });
</script>
</body>
</html>
