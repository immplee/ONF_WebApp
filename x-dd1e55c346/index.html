<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>bridge spike B</title>
<style>
body{font:18px -apple-system,system-ui,sans-serif;margin:16px;background:#fff;color:#111}
#box{font-size:26px;line-height:1.45;padding:12px 14px;border:3px solid #06c;border-radius:10px;white-space:pre-wrap;word-break:break-all}
iframe{width:100%;height:340px;border:1px dashed #999;margin-top:12px}
</style></head><body>
<div id="box">껍데기 → Pages → 구글 (3겹) 기다리는 중…</div>
<iframe src="https://onf-app.pages.dev/"></iframe>
<script>
// 버리는 시험(2026-10-23 · 0단계) — 끝나면 지움. 교재 코드 없음.
window.addEventListener('message', function (ev) {
  if (ev.origin !== 'https://onf-app.pages.dev') return;
  var d = ev.data || {};
  if (d.onf !== 'spikeR' || !d.R) return;
  var R = window.__R = d.R; R.shellMs = Math.round(performance.now());
  document.getElementById('box').textContent = R.state === 'done'
    ? '3겹 · ' + R.ua + '\nready ' + R.ready + ' ms (시도 ' + R.attempt + (R.attempt === 2 ? ' credentialless' : '') + ')\necho median ' + R.echoMed + ' ms · p90 ' + R.echoP90 + ' ms\n(껍데기 열고 ' + R.shellMs + ' ms에 결과)'
    : '3겹 · ' + R.ua + '\n❌ ' + R.err;
});
</script>
</body></html>
